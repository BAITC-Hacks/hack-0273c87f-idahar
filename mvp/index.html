 ${business?`<section class="hero"><div><h2>Ваши задачи находят людей</h2><p>Чёткое описание помогает подходящим командам быстрее откликнуться. Улучшите карточку — и она станет заметнее в каталоге.</p></div><div class="hero-stat"><div class="stat"><b>${tasks.length}</b><span>опубликованных задач</span></div><div class="stat"><b>${proposals.length}</b><span>предложений команд</span></div><div class="progress-wrap"><div class="progress-text"><b>${Math.round(tasks.reduce((n,t)=>n+(Number(t.quality)||0),0)/Math.max(1,tasks.length))}%</b><span>ср. качество</span></div></div></section>`:`<section class="hero"><div><h2>Выбирай задачу по интересу</h2><p>Все задачи открыты для просмотра. Подай предложение с идеей, планом и сроком — бизнес вручную решит, с кем работать.</p></div><div class="hero-stat"><div class="stat"><b>${tasks.length}</b><span>задач в каталоге</span></div><div class="stat"><b>${myProposals().length}</b><span>предложений команды</span></div><div class="progress-wrap"><div class="progress-text"><b>${myProposals().filter(p=>p.status==='selected').length}</b><span>выбрано бизнесом</span></div></div></div></section>`}
 ${business?renderBusinessProgress():''}
 <div class="toolbar"><h2>${tab==='my'?'Мои предложения':'Открытый каталог'} <span class="small">${tab==='my'?myProposals().length:tasks.length+' задач'}</span></h2><input class="search" id="search" type="search" placeholder="⌕  Найти задачу" value="${escapeHtml(query)}" aria-label="Поиск по задачам"><div class="filters">${['Все задачи','Веб-разработка','Дизайн','Исследование'].map(f=>`<button class="filter ${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}<select class="filter" id="readiness-filter" aria-label="Фильтр по уровню готовности">${['Все уровни','Черновик','Рабочая','Готовая','Приоритетная'].map(x=>`<option ${readinessFilter===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <div class="cards" id="cards"></div>
 <div class="insight"><div class="spark">✦</div><div><b>${business?'Подсказка для заказчика':'Подборка для вас'}</b><br><span>${business?'У задач с ясным ожидаемым результатом в среднем больше откликов. Добавьте конкретный пример того, что команда должна подготовить.':'Вам особенно подходят задачи, где нужны UX-исследования и прототипирование.'}</span></div></div>`;
 document.querySelector('#new-task')?.addEventListener('click',()=>openForm());document.querySelector('#student-team')?.addEventListener('change',e=>{studentTeamId=e.target.value;persist();render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelector('#search')?.addEventListener('input',e=>{query=e.target.value;paintCards()});document.querySelector('#readiness-filter')?.addEventListener('change',e=>{readinessFilter=e.target.value;paintCards()});paintCards();}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function readiness(score){return score<40?'Черновик':score<70?'Рабочая':score<90?'Готовая':'Приоритетная'}
function renderBusinessProgress(){const best=Math.max(0,...tasks.map(t=>Number(t.quality)||0));const next=best<40?40:best<70?70:best<90?90:100;const label=readiness(best);return `<section class="gamify"><div><div class="game-title"><div class="level-icon">✦</div><span>Готовность ваших задач</span><span class="game-points">${best}/100</span></div><div class="game-sub">Лучший уровень сейчас: «${label}». ${best<90?'Подтверждайте заполненные поля, чтобы поднять задачу в каталоге.':'Задача полностью готова и может получить приоритетное место.'}</div><div class="game-meter"><div class="game-meter-row"><span>Следующий уровень: ${best<40?'Рабочая':best<70?'Готовая':best<90?'Приоритетная':'Максимум'}</span><span>${best}/${next}</span></div><div class="meter"><span style="width:${best}%"></span></div></div></div><div class="badges"><span class="badge ${best>=40?'earned':''}"><i>📝</i> Рабочая</span><span class="badge ${best>=70?'earned':''}"><i>🌿</i> Готовая</span><span class="badge ${best>=90?'earned':''}"><i>⭐</i> Приоритетная</span></div></section>`}
function paintCards(){const el=document.querySelector('#cards');if(!el)return;const q=query.trim().toLocaleLowerCase('ru');let visible=tasks.filter(t=>(filter==='Все задачи'||t.category===filter)&&(readinessFilter==='Все уровни'||readiness(t.quality)===readinessFilter)&&(tab!=='my'||myProposals().some(p=>p.taskId===t.id))&&(!q||[t.title,t.desc,t.company,...t.skills].join(' ').toLocaleLowerCase('ru').includes(q))).sort((a,b)=>(Number(b.quality)||0)-(Number(a.quality)||0));if(!visible.length){el.innerHTML=`<div class="empty">${tab==='my'&&!myReplies.length?'Пока нет предложений этой команды. Найдите интересную задачу в каталоге.':'Ничего не найдено. Попробуйте изменить поиск или фильтр.'}</div>`;return}el.innerHTML=visible.map(t=>`<article class="card"><div class="card-top"><span class="tag">${escapeHtml(t.category)}</span>${role==='student'?`<span class="match">✦ ${t.match}% совпадение</span>`:`<span class="match">Качество ${t.quality}% · ${readiness(t.quality)}</span>`}</div><h3>${escapeHtml(t.title)}</h3><p>${escapeHtml(t.desc)}</p><div class="chips">${t.skills.map(s=>`<span class="chip">${escapeHtml(s)}</span>`).join('')}</div><div class="card-foot"><div class="company"><div class="company-logo">${escapeHtml(t.logo)}</div><div>${escapeHtml(t.company)}<div class="small">${escapeHtml(t.due)} · <span class="status ${t.status==='Открыта'?'open':t.status==='Команда выбрана'?'selected':''}">${escapeHtml(t.status)}</span></div>${t.selectedTeam?`<div class="small">Выбрана: ${escapeHtml(t.selectedTeam)}</div>`:''}</div></div><button class="text-btn" data-open="${t.id}">${role==='student'?(myProposals().some(p=>p.taskId===t.id)?'Предложение отправлено ✓':'Подробнее →'):'Открыть карточку →'}</button></div></article>`).join('');el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openTask(+b.dataset.open));}
function openTask(id){selected=tasks.find(t=>t.id===id);const t=selected;const mine=proposals.find(p=>p.taskId===t.id&&p.teamId===studentTeamId);const rubricView=t.rubric?rubricFields.map(([key,label,points])=>`<div class="small">${t.rubric[key]?`✓ ${escapeHtml(label)} — ${points}`:`○ ${escapeHtml(label)} — ${points}`}</div>`).join(''):'<div class="small">Рейтинг демонстрационной карточки; детализация появится после редактирования и подтверждения полей.</div>';document.querySelector('#modal').innerHTML=`<div class="modal-head"><div><span class="tag">${escapeHtml(t.category)}</span><h2 style="margin-top:12px">${escapeHtml(t.title)}</h2><p>${escapeHtml(t.company)} · ${escapeHtml(t.due)}</p></div><button class="close" data-close>×</button></div><p style="line-height:1.6;color:#656b61">${escapeHtml(t.desc)}</p><div class="chips">${t.skills.map(s=>`<span class="chip">${escapeHtml(s)}</span>`).join('')}</div><div class="scorebox"><div class="score-head"><span>Рейтинг готовности · ${readiness(t.quality)}</span><b>${t.quality}/100</b></div><div class="meter"><span style="width:${t.quality}%"></span></div>${rubricView}<div class="suggestion" style="margin-top:8px">${t.quality<40?'Черновик: виден всем, но требует уточнения.':t.quality<70?'Рабочая: можно откликаться, система может рекомендовать задачу.':t.quality<90?'Готовая: повышенная позиция в каталоге.':'Приоритетная: полностью готова к работе.'}</div></div><div style="font-size:12px;color:#656b61">${proposalsFor(t.id).length} предложений · задача доступна всем командам</div>${mine?`<div class="scorebox"><b>Ваше предложение:</b> ${escapeHtml(mine.status==='pending'?'Ожидает решения':mine.status==='selected'?'Выбрано бизнесом':'Отклонено')}</div>`:''}<div class="modal-actions"><button class="secondary" data-close>Закрыть</button>${role==='student'?`<button class="primary" id="reply" ${mine?'disabled':''}>${mine?'Предложение отправлено':'Подать предложение'}</button>`:`<button class="secondary" id="edit-task">Улучшить карточку</button><button class="primary" id="view-replies">Предложения (${proposalsFor(t.id).length})</button>`}</div>`;showModal();bindClose();document.querySelector('#edit-task')?.addEventListener('click',()=>openForm(t));document.querySelector('#reply')?.addEventListener('click',()=>openProposalForm(t));document.querySelector('#view-replies')?.addEventListener('click',openApplicants)}
function openProposalForm(task){const team=teams.find(t=>t.id===studentTeamId);document.querySelector('#modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow">${escapeHtml(team.name)} · ${team.members} участника</div><h2 style="margin-top:8px">Предложить решение</h2><p>${escapeHtml(task.title)}</p></div><button class="close" data-close>×</button></div><div class="field"><label>Идея решения</label><textarea id="p-idea" placeholder="Что предлагает ваша команда?"></textarea></div><div class="field"><label>План работы</label><textarea id="p-plan" placeholder="Ключевые шаги и личный вклад участников"></textarea></div><div class="row"><div class="field"><label>Срок</label><input id="p-due" placeholder="Например, 10 дней"></div><div class="field"><label>Ссылка на прототип (необязательно)</label><input id="p-link" placeholder="https://..."></div></div><div class="modal-actions"><button class="secondary" data-close>Отмена</button><button class="primary" id="send-proposal">Отправить предложение</button></div>`;bindClose();document.querySelector('#send-proposal').onclick=()=>{const idea=document.querySelector('#p-idea').value.trim(),plan=document.querySelector('#p-plan').value.trim(),due=document.querySelector('#p-due').value.trim(),link=document.querySelector('#p-link').value.trim();if(!idea||!plan||!due){showToast('Добавьте идею, план и срок');return}if(link&&!/^https?:\/\//i.test(link)){showToast('Ссылка должна начинаться с https:// или http://');return}if(proposals.some(p=>p.taskId===task.id&&p.teamId===studentTeamId)){showToast('Эта команда уже отправила предложение');return}proposals.push({id:'p'+Date.now(),taskId:task.id,teamId:studentTeamId,idea,plan,due,link,status:'pending'});task.team=proposalsFor(task.id).length;task.status='Есть предложения';persist();closeModal();render();showToast('Предложение сохранено и отправлено заказчику')}}
function openApplicants(){const t=selected;const list=proposalsFor(t.id);const cards=list.length?list.map(p=>{const team=teams.find(x=>x.id===p.teamId)||{name:'Команда',members:0,interests:'',skills:''};return `<article class="card" style="margin:10px 0;padding:16px;box-shadow:none"><div class="card-top"><b>${escapeHtml(team.name)}</b><span class="status ${p.status==='selected'?'selected':p.status==='pending'?'open':''}">${p.status==='selected'?'Выбрано':p.status==='rejected'?'Отклонено':'Ожидает решения'}</span></div><div class="small" style="margin-top:7px">${team.members} участника · ${escapeHtml(team.skills)}<br>Интересы: ${escapeHtml(team.interests)}</div><p><b>Идея:</b> ${escapeHtml(p.idea)}</p><p><b>План:</b> ${escapeHtml(p.plan)}</p><div class="small">Срок: ${escapeHtml(p.due)} ${p.link?`· <a href="${escapeHtml(p.link)}" target="_blank" rel="noopener">Прототип / материалы</a>`:''}</div><div class="modal-actions"><button class="secondary" data-reject="${escapeHtml(p.id)}">Отклонить</button><button class="primary" data-select="${escapeHtml(p.id)}">${p.status==='selected'?'Снять выбор':'Выбрать команду'}</button></div></article>`}).join(''):'<div class="empty">Пока нет предложений. Бизнес может оставить задачу открытой без выбора команды.</div>';document.querySelector('#modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow">${escapeHtml(t.company)}</div><h2 style="margin-top:8px">Предложения команд</h2><p>${escapeHtml(t.title)} · можно выбрать одну, несколько или ни одной</p></div><button class="close" data-close>×</button></div><div class="small">Выбрано: ${list.filter(p=>p.status==='selected').length} из ${list.length}</div>${cards}<div class="modal-actions"><button class="secondary" data-close>Закрыть</button></div>`;bindClose();document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{const p=proposals.find(x=>x.id===b.dataset.select);p.status=p.status==='selected'?'pending':'selected';persist();openApplicants()});document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{const p=proposals.find(x=>x.id===b.dataset.reject);p.status='rejected';persist();openApplicants()})}
const rubricFields=[['context','Контекст и потребность','20 баллов','Что происходит сейчас и что нужно изменить?'],['materials','Данные и материалы','20 баллов','Какие данные, примеры или источники доступны?'],['result','Ожидаемый результат','15 баллов','Что команда должна подготовить?'],['criteria','Критерии успеха','15 баллов','По каким признакам вы поймёте, что результат подходит?'],['constraints','Ограничения','10 баллов','Какие есть сроки, технологии, доступы или другие границы?'],['users','Пользователи','10 баллов','Для кого создаётся решение?'],['contact','Связь с бизнесом','10 баллов','Кто даст обратную связь и в каком формате?']];
let editingTaskId=null;
function rubricFromForm(){return Object.fromEntries(rubricFields.map(([key])=>[key,document.querySelector('#f-'+key)?.value.trim()||'']))}
function rubricScore(r={}){return rubricFields.reduce((sum,[key,,points])=>sum+(String(r[key]||'').trim()?Number.parseInt(points,10):0),0)}
function openForm(task=null){aiMode=false;editingTaskId=task?.id||null;const values=task?.rubric||{};if(task&&!values.context)values.context=task.desc||'';document.querySelector('#modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow">${task?'Улучшение задачи':'Новая возможность'}</div><h2 style="margin-top:8px">${task?'Уточните карточку':'Расскажите о задаче'}</h2><p>Рейтинг растёт только за заполненные и подтверждённые сведения.</p></div><button class="close" data-close>×</button></div><div class="field"><label>Название задачи</label><input id="f-title" value="${escapeHtml(task?.title||'')}" placeholder="Например, улучшить запись клиентов"></div>${rubricFields.map(([key,label,points,placeholder])=>`<div class="field"><label>${label} <span class="small">${points}</span></label><textarea id="f-${key}" placeholder="${placeholder}">${escapeHtml(values[key]||'')}</textarea></div>`).join('')}<div class="row"><div class="field"><label>Категория</label><select id="f-cat">${['Веб-разработка','Дизайн','Исследование'].map(c=>`<option ${task?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Срок</label><input id="f-date" value="${escapeHtml(task?.due||'')}" placeholder="Например, через 2 недели"></div></div><div class="field"><label>Навыки</label><input id="f-skills" value="${escapeHtml((task?.skills||[]).join(', '))}" placeholder="React, интервью, Figma"></div><label class="field" style="display:flex;gap:9px;align-items:flex-start"><input id="f-confirm" type="checkbox" style="width:auto;margin-top:2px"><span>Подтверждаю, что заполненные сведения точны и могут быть опубликованы.</span></label><div class="scorebox"><div class="score-head"><span id="score-label">Баллы после подтверждения</span><b id="score">0/100</b></div><div class="meter"><span id="meter" style="width:0%"></span></div><div class="suggestion" id="advice">Заполнено 0 из 7 критериев. Баллы начисляются после вашего подтверждения.</div><button class="secondary" id="ai-questions" style="margin-top:12px">✦ Задать 3 вопроса с OpenAI</button><div id="ai-question-list"></div></div><div class="modal-actions"><button class="secondary" data-close>Отмена</button><button class="primary" id="publish">${task?'Сохранить изменения':'Опубликовать в каталоге'}</button></div>`;showModal();bindClose();rubricFields.forEach(([key])=>document.querySelector('#f-'+key).addEventListener('input',updateScore));document.querySelector('#f-title').addEventListener('input',updateScore);document.querySelector('#f-confirm').addEventListener('change',updateScore);document.querySelector('#f-date').addEventListener('input',updateScore);document.querySelector('#f-skills').addEventListener('input',updateScore);document.querySelector('#ai-questions').onclick=askAIQuestions;document.querySelector('#publish').onclick=publishTask;updateScore()}
function updateScore(event){if(event?.target?.id!=='f-confirm')document.querySelector('#f-confirm').checked=false;const values=rubricFromForm(),possible=rubricScore(values),confirmed=document.querySelector('#f-confirm').checked,score=confirmed?possible:0;document.querySelector('#score').textContent=score+'/100';document.querySelector('#meter').style.width=score+'%';document.querySelector('#score-label').textContent=confirmed?'Подтверждённый рейтинг':'Баллы после подтверждения';const missing=rubricFields.filter(([key])=>!values[key]).map(([,label])=>label);document.querySelector('#advice').textContent=confirmed?`${readiness(score)} · заполнено ${7-missing.length} из 7 критериев${missing.length?'; не хватает: '+missing.join(', '):''}.`: `Предварительно заполнено ${7-missing.length} из 7 критериев. Подтвердите сведения, чтобы начислить ${possible} баллов${missing.length?'; можно добавить: '+missing.join(', '):''}.`}
async function askAIQuestions(){const btn=document.querySelector('#ai-questions'),values=rubricFromForm(),description=JSON.stringify(values);const title=document.querySelector('#f-title').value.trim();if(!title||!Object.values(values).some(Boolean)){showToast('Сначала добавь название и хотя бы одно сведение о задаче');return}btn.disabled=true;btn.textContent='Готовлю вопросы…';try{const response=await fetch('/api/questions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title,description})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Не удалось получить вопросы');window.aiQuestions=data.questions;document.querySelector('#ai-question-list').innerHTML=`<div class="suggestion" style="margin-top:14px">Ответь на вопросы. Ответы добавятся в соответствующие поля карточки для проверки.</div>${data.questions.map((q,i)=>`<div class="field"><label>${i+1}. ${escapeHtml(q.question)}</label><textarea id="ai-answer-${i}" placeholder="Твой ответ"></textarea></div>`).join('')}<button class="secondary" id="apply-ai-answers">Добавить ответы в карточку</button>`;document.querySelector('#apply-ai-answers').onclick=()=>{data.questions.forEach((q,i)=>{const answer=document.querySelector('#ai-answer-'+i).value.trim();if(!answer)return;const field=document.querySelector('#f-'+q.field);field.value=field.value?field.value+'\n'+answer:answer});document.querySelector('#f-confirm').checked=false;updateScore({target:{id:'ai-answer'}});showToast('Ответы перенесены в черновик — проверь и подтверди карточку')};showToast('OpenAI подготовил 3 уточняющих вопроса')}catch(error){showToast(error.message||'Не удалось связаться с OpenAI')}finally{btn.disabled=false;btn.textContent='✦ Задать 3 вопроса с OpenAI'}}
function publishTask(){const title=document.querySelector('#f-title').value.trim(),rubric=rubricFromForm(),confirmed=document.querySelector('#f-confirm').checked;if(!title||!rubric.context){showToast('Добавьте название и контекст задачи');return}if(!confirmed){showToast('Подтвердите точность заполненных сведений');return}const score=rubricScore(rubric),task={id:editingTaskId||Date.now(),title,category:document.querySelector('#f-cat').value,desc:rubric.context,rubric,skills:(document.querySelector('#f-skills').value||'Командная работа').split(',').map(x=>x.trim()).filter(Boolean),company:editingTaskId?tasks.find(t=>t.id===editingTaskId).company:'Ваша компания',logo:editingTaskId?tasks.find(t=>t.id===editingTaskId).logo:'В',due:document.querySelector('#f-date').value||'Срок уточняется',match:88,status:editingTaskId?tasks.find(t=>t.id===editingTaskId).status:'Открыта',quality:score,team:editingTaskId?tasks.find(t=>t.id===editingTaskId).team:0};if(editingTaskId){tasks=tasks.map(t=>t.id===editingTaskId?{...t,...task}:t)}else tasks.unshift(task);persist();filter='Все задачи';query='';closeModal();showToast(`Карточка подтверждена · ${score} баллов · ${readiness(score)}`);render()}
function showModal(){document.querySelector('#overlay').classList.add('show')}function closeModal(){document.querySelector('#overlay').classList.remove('show')}function bindClose(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function showToast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;tab='catalog';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};window.addEventListener('storage',e=>{if(e.key==='start-mvp-state'){const state=readSaved();if(state){tasks=state.tasks||tasks;myReplies=state.myReplies||myReplies;proposals=state.proposals||proposals;studentTeamId=state.studentTeamId||studentTeamId;render()}}});render();
</script>
