<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">↗</div>SanaQuest</div>

  </header>
  <main class="page" id="app"><div class="empty"><h1>Запустите приложение через сервер</h1><p>Если страница открыта как файл, каталог не загрузится. Запустите <code>start.cmd</code> или выполните <code>npm start</code> в папке проекта, затем откройте <code>http://127.0.0.1:4173</code>.</p></div></main>
</div>
